<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackpad</title>
<style>
  :root {
    --bg: #e8edf2;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #5d6b79;
    --line: #c9d3dd;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --card-top: #dfe8ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151b;
      --surface: #18212a;
      --ink: #e6edf3;
      --muted: #93a1af;
      --line: #2b3844;
      --accent: #6f93ff;
      --accent-ink: #0f151b;
      --card-top: #243a74;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 20px clamp(16px, 4vw, 40px) 8px; gap: 12px; flex-wrap: wrap;
  }
  h1 { margin: 0; font: 600 1.5rem/1.2 ui-serif, Georgia, serif; letter-spacing: -0.01em; }
  #online { color: var(--muted); font-size: 0.9rem; }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px;
    padding: 12px clamp(16px, 4vw, 40px) 40px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 0.85rem; }
  textarea {
    width: 100%; min-height: 380px; border: 0; resize: vertical; padding: 16px;
    background: transparent; color: var(--ink); font: 1.05rem/1.7 ui-serif, Georgia, serif;
    border-radius: 0 0 10px 10px;
  }
  aside { padding: 16px; }
  aside h2 { margin: 0 0 4px; font-size: 1rem; }
  aside p { margin: 0 0 14px; color: var(--muted); font-size: 0.875rem; }
  .stack { display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .card {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--bg); color: var(--muted);
  }
  .card.top { background: var(--card-top); color: var(--ink); border-color: var(--accent); }
  .card.empty { font-style: italic; text-align: center; }
  .depths { display: flex; gap: 16px; margin-top: 14px; font-size: 0.875rem; color: var(--muted); }
  .depths b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #status { min-height: 1.4em; font-size: 0.8rem; color: var(--muted); padding: 0 16px 10px; }
  @media (prefers-reduced-motion: no-preference) {
    .card.top { animation: land 160ms ease-out; }
    @keyframes land { from { transform: translateY(-8px); opacity: 0; } }
  }
</style>
</head>
<body>
<header>
  <h1>Stackpad</h1>
  <div id="online" aria-live="polite"></div>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <button id="undo" disabled>Undo</button>
      <button id="redo" disabled>Redo</button>
      <span class="hint">Ctrl/Cmd+Z and Ctrl/Cmd+Shift+Z work too</span>
    </div>
    <textarea id="editor" aria-label="Your note" placeholder="Start typing. Pause for a moment and your text is saved as a step you can undo."></textarea>
    <div id="status" aria-live="polite"></div>
  </section>

  <aside class="panel">
    <h2>Your undo stack</h2>
    <p>Newest save sits on top. Undo pops it off and pushes it onto the redo stack.</p>
    <div class="stack" id="stack"></div>
    <div class="depths">
      <span>Undo: <b id="ud">0</b></span>
      <span>Redo: <b id="rd">0</b></span>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const editor = $("editor"), undoBtn = $("undo"), redoBtn = $("redo");
let sessionId = sessionStorage.getItem("stackpad-id");
let timer = null, busy = Promise.resolve();

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 404 && path === "state") return null;
  if (res.status === 404 && path !== "session") {   // session expired on server
    sessionId = null; sessionStorage.removeItem("stackpad-id");
    await start(editor.value);
    return null;
  }
  return res.json();
}

function render(s, replaceText) {
  if (!s) return;
  if (replaceText) editor.value = s.text;
  undoBtn.disabled = s.undoDepth === 0;
  redoBtn.disabled = s.redoDepth === 0;
  $("ud").textContent = s.undoDepth;
  $("rd").textContent = s.redoDepth;
  const stack = $("stack");
  stack.innerHTML = "";
  if (!s.undoPreview.length) {
    const c = document.createElement("div");
    c.className = "card empty"; c.textContent = "Empty. Type something to start.";
    stack.appendChild(c);
  }
  s.undoPreview.forEach((t, i) => {
    const c = document.createElement("div");
    c.className = "card" + (i === 0 ? " top" : "");
    c.textContent = t === "" ? "(blank note)" : t;
    stack.appendChild(c);
  });
}

async function start(initialText) {
  const s = await api("session");
  sessionId = s.id; sessionStorage.setItem("stackpad-id", s.id);
  if (initialText) { render(await api("edit", { id: sessionId, text: initialText }), false); }
  else render(s, true);
}

function queue(fn) { busy = busy.then(fn).catch(() => { $("status").textContent = "Connection problem. Retrying on next change."; }); return busy; }

async function save() {
  clearTimeout(timer); timer = null;
  const text = editor.value;
  await queue(async () => {
    const s = await api("edit", { id: sessionId, text });
    render(s, false);
    if (s) $("status").textContent = "Saved";
  });
}

editor.addEventListener("input", () => {
  $("status").textContent = "Typing…";
  clearTimeout(timer); timer = setTimeout(save, 700);
});

async function step(kind) {
  if (timer) await save();
  await queue(async () => render(await api(kind, { id: sessionId }), true));
}
undoBtn.onclick = () => step("undo");
redoBtn.onclick = () => step("redo");

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    step(e.shiftKey ? "redo" : "undo");
  }
});

async function pollStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    $("online").textContent = s.active + (s.active === 1 ? " person" : " people") + " writing right now";
  } catch {}
}

(async () => {
  if (sessionId) {
    const s = await api("state", { id: sessionId });
    if (s) render(s, true);
    else await start("");
  } else await start("");
  pollStats(); setInterval(pollStats, 10000);
})();
</script>
</body>
</html>
